<!doctype html>
<html lang="es">
<head>
    <link rel="stylesheet" href="../../css/cssExplorer.css">
  <title>Ejercicio Internet Explorer</title>
</head>
<body>


  <div class="ie-window" role="region" aria-label="Ventana simulada de Internet Explorer">

    <div class="titlebar">
      <div class="icon">
            <img src="../../img/explorer.png" alt="icono">
        </div>
      <div class="title">Posicionamiento - Microsoft Internet Explorer</div>

      <div class="window-controls" aria-hidden="true">
        <div class="ctrl" title="Minimizar">_</div>
        <div class="ctrl" title="Maximizar">▢</div>
        <div class="ctrl" title="Cerrar">✕</div>
      </div>
    </div>

    <!-- Pequeña barra debajo del título para separar de contenido (simula borde fino) -->
    <div class="toolbar"></div>

    <!-- Área de contenido en blanco -->
    <div class="contenido">
      
        <div class="boxred">
            <p>Título</p>
        </div>
        <div class="boxblue">
            <p>Texto del interior del DIV. Este elemento DIV, junto con el texto, se va a situar en una posición concreta del documento.</p>
        </div>
    </div>
  </div>
  </div>

</body>
</html>
